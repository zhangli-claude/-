<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="练了吗 —— 每天提醒你完成运动量的私人训练员">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="练了吗">
<title>练了吗 · 每日运动提醒</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main id="app" class="app"></main>

  <nav id="tabbar" class="tabbar" aria-label="主导航">
    <button class="tab" data-route="today">
      <span class="tab-ico">◎</span><span class="tab-txt">今日</span>
    </button>
    <button class="tab" data-route="plan">
      <span class="tab-ico">▤</span><span class="tab-txt">计划</span>
    </button>
    <button class="tab" data-route="library">
      <span class="tab-ico">✦</span><span class="tab-txt">动作库</span>
    </button>
    <button class="tab" data-route="stats">
      <span class="tab-ico">◔</span><span class="tab-txt">数据</span>
    </button>
    <button class="tab" data-route="me">
      <span class="tab-ico">☺</span><span class="tab-txt">我的</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/musclemap.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // PWA：仅在 http(s) / localhost 下注册（file:// 打开时不注册，避免报错）
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* 离线不可用时不阻塞页面 */ });
      });
    }
  </script>
</body>
</html>
